<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rush - ArcadeZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-wrapper">
        <a class="back-link" href="../../index.html">← Vissza az ArcadeZone-ba</a>

        <header>
            <p class="eyebrow">ARCADEZONE ORIGINAL</p>
            <h1>NEON <span>RUSH</span></h1>
            <p class="subtitle">Ugorj át minden akadályt, és döntsd meg a rekordodat!</p>
        </header>

        <section class="stats">
            <div class="stat">
                <span>PONTSZÁM</span>
                <strong id="score">0</strong>
            </div>
            <div class="stat">
                <span>REKORD</span>
                <strong id="best">0</strong>
            </div>
            <div class="stat">
                <span>SEBESSÉG</span>
                <strong id="speed">1.0x</strong>
            </div>
        </section>

        <div class="game-container">
            <canvas id="gameCanvas" width="900" height="420"></canvas>

            <div class="overlay" id="overlay">
                <h2 id="overlayTitle">Készen állsz?</h2>
                <p id="overlayText">Ugorj át az akadályokon, és maradj játékban!</p>
                <button id="startButton">JÁTÉK INDÍTÁSA</button>
            </div>
        </div>

        <p class="controls">
            UGRÁS: <kbd>SPACE</kbd> / <kbd>↑</kbd> / KATTINTÁS
        </p>

        <button id="mobileJump" class="mobile-jump">UGRÁS</button>
    </main>

    <script src="game.js"></script>
</body>
</html>
