<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipper | ArcadeZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <a href="../../index.html" class="logo">ARCADE<span>ZONE</span></a>
    <a href="../../index.html" class="back-button">← Vissza a főoldalra</a>
</header>

<main class="game-container">

    <div class="game-heading">
        <span class="eyebrow">ARCADEZONE ORIGINAL</span>
        <h1>NEON <span>FLIPPER</span></h1>
        <p>Tartsd játékban a golyót, és gyűjts minél több pontot!</p>
    </div>

    <div class="scoreboard">
        <div class="stat-card">
            <span>PONTSZÁM</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat-card">
            <span>REKORD</span>
            <strong id="best">0</strong>
        </div>

        <div class="stat-card">
            <span>ÉLETEK</span>
            <strong id="lives">3</strong>
        </div>
    </div>

    <div class="machine">
        <canvas id="gameCanvas" width="500" height="750"></canvas>

        <div id="overlay" class="overlay">
            <h2 id="overlayTitle">NEON FLIPPER</h2>
            <p id="overlayText">Készen állsz? Indulhat a játék!</p>
            <button id="startButton">JÁTÉK INDÍTÁSA</button>
        </div>
    </div>

    <div class="controls">
        <p><strong>A / ←</strong> Bal ütő</p>
        <p><strong>D / →</strong> Jobb ütő</p>
        <p><strong>SPACE</strong> Golyó indítása</p>
    </div>

    <div class="mobile-controls">
        <button data-action="left">BAL</button>
        <button data-action="launch">INDÍTÁS</button>
        <button data-action="right">JOBB</button>
    </div>

</main>

<footer>© 2026 ArcadeZone — Play. Beat. Repeat.</footer>

<script src="game.js"></script>
</body>
</html>
